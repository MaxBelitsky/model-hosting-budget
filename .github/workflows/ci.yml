name: CI

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .[dev]
      - name: Test
        run: python -m pytest
      - name: Build distributions
        run: python -m build
      - name: Smoke editable CLI
        run: hosting-budget evaluate examples/quote_units.json --offline --out demo-report
      - name: Smoke installed wheel outside checkout
        run: |
          python -m venv /tmp/hosting-budget-wheel-smoke
          /tmp/hosting-budget-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/hosting-budget-wheel-smoke/bin/hosting-budget evaluate "$GITHUB_WORKSPACE/examples/quote_units.json" --offline --out /tmp/hosting-budget-wheel-report
